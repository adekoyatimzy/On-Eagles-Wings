</head>
<body>
    
    <header id="Menubar">

<div class="rccg_logo">
     <a href="index.html" class="logo">
   <img src="Assets/rccg logo.jpg" id="sitelogo" /> <p>RCCG On Eagles Wings</p>
     </a>
  </div>
        
        <div class="menulinks-wrapper">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Our Services</a>
            
            <div class="dropdown">
                <button class="dropbtn">More ▾</button>
                <div class="dropdown-content">
                    <a href="events.html">Events</a>
                    <a href="contact.html">Contact Us</a>
                </div>
            </div>
        </div>
    </header>

<div class="Contentarea" id="contactpage"> 
    <div class="contact-info"> 
        <h1>Contact Us</h1> 
        <h2>Get in touch with the On Eagles Wings team and community.</h2> 
      <div class="contactdetails">
            <h3>Our Location</h3>
            <p>First floor, Clifford House, 1 Paycocke Road, Basildon, Essex SS14 3DP</p>
            <h3>Direct Contact</h3>
            <p><strong>Phone: </strong> +44 7956 493880</p>
            <p><strong>Email: </strong> undecided/ N.A.</p>
        </div> 
    </div>

    <form id="contactform" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="THE CHURCH EMAIL KEY"/>

        <label for="visitor-name">Your Name</label>
        <input type="text" id="visitor-name" name="Name" required placeholder="Enter your full name"/>

        <label for="visitor-email">Email Address</label>
        <input type="email" id="visitor-email" name="Email" required placeholder="Your email address"/>

        <label for="visitor-message">Message</label>
        <textarea id="visitor-message" name="Message" rows="5" required placeholder="Your message"/></textarea>

    <button type="submit" id="submitBtn">Send Message</button>

    <p id="formStatus" style="display: none; font-weight: bold; margin-top: 15px; font-size: 14px;"></p>
    </form>      
</div>

<script type="text/javascript">
// 💡 Fixed: Changed 'contactForm' to 'contactform' to match your HTML
document.getElementById('contactform').addEventListener('submit', function(e) {
  e.preventDefault();
  var form = this;
  var btn = document.getElementById('submitBtn');
  var status = document.getElementById('formStatus');

  btn.disabled = true;
  btn.innerText = 'Sending...';
  status.style.display = 'block';
  status.style.color = '#0A2540'; // 💡 Styled to match your navy blue theme while sending
  status.innerText = 'Sending your message...';

  var formData = new FormData(form);

  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    body: formData
  })
  .then(function(response) {
    return response.json();
  })
  .then(function(data) {
    if (data.success) {
      status.style.color = 'green';
      status.innerText = 'Thank you! Your message has been sent successfully.';
      form.reset();
    } else {
      status.style.color = 'red';
      status.innerText = 'Something went wrong. Please try again.';
    }
  })
  .catch(function() {
    status.style.color = 'red';
    status.innerText = 'Error sending message. Please try again.';
  })
  .finally(function() {
    btn.disabled = false;
    btn.innerText = 'Send Message';
  });
});
</script>
    
</body>
</html>
